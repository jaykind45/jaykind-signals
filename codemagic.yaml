workflows:
  jaykind-ios:
    name: JAYKIND SIGNALS iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: 3.50.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS
        script: flutter build ios --release --no-codesign
      - name: Package IPA correctly
        script: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          /usr/bin/zip -qry JAYKIND_SIGNALS.ipa Payload
    artifacts:
      - JAYKIND_SIGNALS.ipa
